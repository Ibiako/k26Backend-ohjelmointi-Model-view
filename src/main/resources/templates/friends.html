<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Friend List</title>
</head>

<body>
    <h1>Friends</h1>
    <ul>
        <li th:each="friend : ${friends}">
            <span th:text="${friend.firstName}"></span>
            <span th:text="${friend.lastName}"></span>
        </li>
    </ul>

    <p><a th:href="@{/add}">Add friend</a></p>
</body>

</html>
